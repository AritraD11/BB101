<title>DNA &amp; RNA — Lecture Slides (BB 101 Tutorial 2)</title>

<style>
/* ============================================================
   BB 101 — Tutorial 2, 20-minute intro lecture
   Deliberate single dark theme: a blueprint / schematic aesthetic
   for a projector-lecture hook, distinct from the reference
   handbook. Corner-bracket frame is the repeated motif — the
   registration marks on an engineering drawing.
   ============================================================ */

:root{
  --bg:      #0B1220;
  --bg2:     #111B2E;
  --panel:   #14203A;
  --line:    #2A3B5C;
  --line-lo: #1C2843;

  --ink:     #EAF2FF;
  --ink-dim: #8FA3C7;
  --ink-lo:  #5D6E8F;

  --accent:  #48D4E0;
  --accent-soft: #12313A;
  --copper:  #E8A34D;
  --copper-soft: #3A2A14;

  --display: "Helvetica Neue", Arial, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:    "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--display);
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}

/* faint blueprint grid on the body */
body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--line-lo) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-lo) 1px, transparent 1px);
  background-size: 44px 44px;
  opacity:.35;
}

.deck{ position:relative; height:100vh; width:100vw; z-index:1; overflow:hidden; }

.slide{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 6vh 7vw;
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translateX(24px);
  transition:opacity .32s ease, transform .32s ease;
}
.slide.active{
  opacity:1; visibility:visible; pointer-events:auto; transform:translateX(0);
}
.slide.prevleft{ transform:translateX(-24px); }

/* corner brackets — the repeated motif, like drawing registration marks */
.frame{
  position:relative;
  width:min(1180px, 92vw);
  max-height:78vh;
  padding: 5vh 5vw;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 2.6vh;
}
.frame::before, .frame::after,
.frame .cbr, .frame .cbl{
  content:""; position:absolute; width:34px; height:34px;
  border-color:var(--accent); opacity:.55;
}
.frame::before{ top:-6px; left:-6px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
.frame::after{ bottom:-6px; right:-6px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }
.frame .cbr{ top:-6px; right:-6px; border-top:2px solid var(--accent); border-right:2px solid var(--accent); }
.frame .cbl{ bottom:-6px; left:-6px; border-bottom:2px solid var(--accent); border-left:2px solid var(--accent); }

.eyebrow{
  font-family:var(--mono); font-size:clamp(.72rem, 1vw, .88rem);
  letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
  font-weight:600;
}
h1.slide-title{
  font-family:var(--display); font-weight:800;
  font-size:clamp(2.4rem, 5.4vw, 4.6rem);
  line-height:1.04; letter-spacing:-.01em; margin:0; text-align:center;
  text-wrap:balance;
}
h1.slide-title .hi{ color:var(--accent); }
h1.slide-title .hi2{ color:var(--copper); }
p.subtitle{
  font-size:clamp(1.05rem, 1.9vw, 1.55rem); color:var(--ink-dim);
  text-align:center; margin:0; max-width:52ch; line-height:1.4;
}
p.caption{
  font-family:var(--mono); font-size:clamp(.85rem, 1.25vw, 1.05rem);
  color:var(--ink-dim); text-align:center; margin:0; max-width:56ch; line-height:1.55;
}
p.caption b{ color:var(--ink); font-weight:600; }

.tag{
  position:fixed; top:22px; left:26px; z-index:5;
  font-family:var(--mono); font-size:.72rem; letter-spacing:.14em;
  color:var(--ink-lo); text-transform:uppercase;
}

/* --------------------------------------------------------- diagram bits */
.svgwrap{ width:100%; display:flex; justify-content:center; }
.svgwrap svg{ width:100%; height:auto; max-width:900px; }
.lbl{ font-family:var(--mono); font-size:15px; fill:var(--ink); font-weight:600; }
.lbl-dim{ font-family:var(--mono); font-size:12px; fill:var(--ink-dim); }
.lbl-accent{ font-family:var(--mono); font-size:13px; fill:var(--accent); font-weight:700; letter-spacing:.06em; }
.lbl-copper{ font-family:var(--mono); font-size:13px; fill:var(--copper); font-weight:700; letter-spacing:.06em; }

/* -------------------------------------------------------------- 2-panel */
.split{
  display:grid; grid-template-columns:1fr 1fr; gap:22px; width:100%;
  max-width:820px;
}
@media (max-width:700px){ .split{ grid-template-columns:1fr; } }
.panel-box{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:22px 20px; text-align:center;
}
.panel-box h3{
  font-family:var(--mono); font-size:.82rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); margin:0 0 8px; font-weight:700;
}
.panel-box.copper h3{ color:var(--copper); }
.panel-box p{ margin:0; color:var(--ink-dim); font-size:.98rem; line-height:1.5; }

/* --------------------------------------------------------- teaser row */
.teaser-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; width:100%; max-width:900px; }
.teaser-card{
  flex:1 1 190px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:18px 16px; text-align:center;
}
.teaser-card .k{ font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--copper); font-weight:700; margin-bottom:6px; }
.teaser-card .v{ font-family:var(--display); font-weight:700; font-size:1.08rem; margin-bottom:4px; }
.teaser-card .d{ font-size:.85rem; color:var(--ink-dim); line-height:1.4; }

/* --------------------------------------------------------------- lists */
.big-list{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:640px; }
.big-list .item{
  display:flex; align-items:center; gap:16px;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:16px 22px;
}
.big-list .item .n{
  font-family:var(--mono); font-weight:800; font-size:1.1rem; color:var(--accent);
  width:34px; flex:0 0 auto;
}
.big-list .item .t{ font-size:1.15rem; font-weight:600; }
.big-list .item .s{ font-size:.9rem; color:var(--ink-dim); margin-top:2px; }

.rubric{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:700px; }
.rubric .row{
  display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center;
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 22px;
}
.rubric .row .k{
  font-family:var(--mono); font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--copper); font-weight:700; white-space:nowrap;
}
.rubric .row .v{ font-size:1.02rem; color:var(--ink); }
.rubric .row .v small{ display:block; color:var(--ink-dim); font-size:.86rem; margin-top:3px; }

/* ----------------------------------------------------------------- timer */
.timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; }
.timer-digits{
  font-family:var(--mono); font-weight:700; font-size:clamp(4rem, 14vw, 9rem);
  letter-spacing:.02em; color:var(--accent); font-variant-numeric:tabular-nums;
  text-shadow:0 0 40px color-mix(in srgb, var(--accent) 45%, transparent);
}
.timer-digits.warn{ color:var(--copper); text-shadow:0 0 40px color-mix(in srgb, var(--copper) 45%, transparent); }
.timer-btns{ display:flex; gap:12px; }
.tbtn{
  appearance:none; font-family:var(--mono); font-size:.92rem; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; padding:12px 22px; border-radius:8px;
  cursor:pointer; background:var(--panel); color:var(--ink); border:1px solid var(--line-strong, var(--line));
}
.tbtn:hover{ border-color:var(--accent); color:var(--accent); }
.tbtn.primary{ background:var(--accent); color:#04222A; border-color:var(--accent); font-weight:700; }
.tbtn.primary:hover{ filter:brightness(1.08); color:#04222A; }

/* -------------------------------------------------------------- controls */
.progress{
  position:fixed; top:0; left:0; height:3px; background:var(--accent); z-index:10;
  transition:width .3s ease;
}
.counter{
  position:fixed; top:22px; right:26px; z-index:5;
  font-family:var(--mono); font-size:.78rem; color:var(--ink-lo); letter-spacing:.08em;
}
.counter b{ color:var(--ink-dim); }

.navbtn{
  position:fixed; top:50%; transform:translateY(-50%); z-index:6;
  width:52px; height:52px; border-radius:50%;
  background:var(--bg2); border:1px solid var(--line); color:var(--ink-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:1.3rem; transition:border-color .15s, color .15s, opacity .15s;
  opacity:.55;
}
.navbtn:hover{ opacity:1; border-color:var(--accent); color:var(--accent); }
.navbtn.prev{ left:18px; } .navbtn.next{ right:18px; }
.navbtn[disabled]{ opacity:.15; pointer-events:none; }
@media (max-width:640px){ .navbtn{ width:42px; height:42px; font-size:1.05rem; } }

.tapzone{ position:fixed; top:0; bottom:0; width:22%; z-index:4; cursor:pointer; }
.tapzone.left{ left:0; } .tapzone.right{ right:0; }

.hint{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:5;
  font-family:var(--mono); font-size:.74rem; color:var(--ink-lo); letter-spacing:.06em;
  display:flex; align-items:center; gap:10px;
}
.dots{ display:flex; gap:6px; }
.dots span{ width:6px; height:6px; border-radius:50%; background:var(--line); }
.dots span.on{ background:var(--accent); }

.notesBtn{
  position:fixed; top:56px; right:26px; z-index:6;
  font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
  background:var(--bg2); border:1px solid var(--line); color:var(--ink-lo);
  padding:8px 14px; border-radius:20px; cursor:pointer;
}
.notesBtn:hover{ color:var(--accent); border-color:var(--accent); }
.notesBtn.on{ color:var(--copper); border-color:var(--copper); }

.notebar{
  position:fixed; left:0; right:0; bottom:0; z-index:7;
  background:color-mix(in srgb, var(--copper-soft) 92%, transparent);
  border-top:1px solid var(--copper);
  padding:14px 26px 14px calc(26px + 60px);
  font-size:.92rem; color:var(--ink); line-height:1.5;
  transform:translateY(100%); transition:transform .25s ease;
  max-width:100%;
}
.notebar.show{ transform:translateY(0); }
.notebar b{ color:var(--copper); font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; margin-right:10px; }

@media (prefers-reduced-motion: reduce){
  .slide{ transition:none; } .notebar{ transition:none; } .progress{ transition:none; }
}
</style>

<div class="progress" id="progress" style="width:0%"></div>
<span class="tag">BB 101 · Tutorial 2 · Intro Lecture</span>

<script>
(function(){
"use strict";

var SLIDES = [
{
  note: "Open with energy — this is the hook slide, not content. Don't over-explain the roadmap.",
  html: '<div class="frame"><span class="eyebrow">BB 101 · Tutorial 2</span>'+
    '<h1 class="slide-title">DNA &amp; <span class="hi">RNA</span></h1>'+
    '<p class="subtitle">Nature’s original engineering</p></div>'
},
{
  note: "Ask: who's taken a COVID swab test? Let hands go up — that's your buy-in for the whole lecture.",
  html: '<div class="frame"><span class="eyebrow">Before we start</span>'+
    '<h1 class="slide-title">You’ve already<br><span class="hi">used</span> this.</h1>'+
    '<p class="subtitle">Every COVID nasal-swab test ran on exactly the system we’re introducing today.</p></div>'
},
{
  note: "This is the only diagram they need to remember. Say it slowly: archive, working copy, output device. Everything else today is elaboration on this one line.",
  html: '<div class="frame"><span class="eyebrow">The whole picture, in one line</span>'+
    diagramBigPicture()+
    '<p class="caption">One system. Three components. Everything else today is detail on this diagram.</p></div>'
},
{
  note: "If anyone's done networking or EE, twisted pair cancels interference — DNA twists for mechanical/chemical stability instead. The analogy isn't exact, and that's fine to say if asked.",
  html: '<div class="frame"><span class="eyebrow">What DNA physically is</span>'+
    diagramTwistedPair()+
    '<p class="caption">Two strands, twisted together for stability — the same reason your <b>Ethernet cable</b> does it.</p></div>'
},
{
  note: "Like a SATA or USB-C plug — the shape prevents a wrong connection. Don't go into purine/pyrimidine ring sizes; that's reference-material depth, not today.",
  html: '<div class="frame"><span class="eyebrow">The alphabet</span>'+
    diagramAlphabet()+
    '<p class="caption">A 4-symbol code — and the connectors are <b>keyed</b>. Wrong pairings simply don’t fit.</p></div>'
},
{
  note: "Mechanical engineers in the room will get this instantly. This IS the reason RNA exists — protect the original, work off a copy.",
  html: '<div class="frame"><span class="eyebrow">DNA vs RNA</span>'+
    '<div class="split">'+
      '<div class="panel-box"><h3>DNA</h3><p><b style="color:var(--ink)">Master drawing.</b> Archived. Never leaves. Consulted, not consumed.</p></div>'+
      '<div class="panel-box copper"><h3>RNA</h3><p><b style="color:var(--ink)">Shop copy.</b> Goes to the floor. Gets marked up, used, discarded.</p></div>'+
    '</div>'+
    '<p class="caption">You never hand the master drawing to the machinist — you hand them a copy.</p></div>'
},
{
  note: "Skip leading/lagging strand entirely — too much detail for today. Just: it unzips, each half becomes the template for a new matching half.",
  html: '<div class="frame"><span class="eyebrow">Copying the code — replication</span>'+
    diagramZipper()+
    '<p class="caption">Unzip. Rebuild both halves. <b>Two identical zippers</b> where there was one.</p></div>'
},
{
  note: "This is the central dogma, in factory language. Emphasize: the ribosome reads instructions, it doesn't improvise.",
  html: '<div class="frame"><span class="eyebrow">Reading the code — transcription &amp; translation</span>'+
    diagramFactory()+
    '<p class="caption">The blueprint stays in the office. A work order goes to the machine. The machine builds the part.</p></div>'
},
{
  note: "Do not get into degeneracy or wobble today — that is next-level detail. One sentence, then move on.",
  html: '<div class="frame"><span class="eyebrow">The genetic code</span>'+
    diagramLookup()+
    '<p class="caption">Fixed-width instruction words. <b>Three letters in, one building block out.</b></p></div>'
},
{
  note: "This is the bridge into the activity. Land it with energy — 'and today, you're going to go find out what's happening at the edge of this, right now.'",
  html: '<div class="frame"><span class="eyebrow">Where this is headed</span>'+
    '<h1 class="slide-title" style="font-size:clamp(1.8rem,3.4vw,2.6rem)">This is a <span class="hi2">live</span> engineering discipline.</h1>'+
    '<div class="teaser-row">'+
      '<div class="teaser-card"><div class="k">PCR</div><div class="v">The photocopier</div><div class="d">Doubles one DNA molecule into billions</div></div>'+
      '<div class="teaser-card"><div class="k">CRISPR</div><div class="v">The scissors</div><div class="d">Cuts and edits the code directly</div></div>'+
      '<div class="teaser-card"><div class="k">DNA storage</div><div class="v">The archive</div><div class="d">Data written into synthetic DNA</div></div>'+
      '<div class="teaser-card"><div class="k">Synthetic biology</div><div class="v">The compiler</div><div class="d">Writing new genetic code from scratch</div></div>'+
    '</div>'+
    '<p class="caption">None of this is finished. It’s being built right now — and that’s what you’re about to go read about.</p></div>'
},
{
  note: "Hand out or point to the article list now. Assign one article per group (or let them pick) before starting the timer.",
  html: '<div class="frame"><span class="eyebrow">Now it’s your turn</span>'+
    '<h1 class="slide-title" style="font-size:clamp(2rem,4vw,3rem)">Group activity</h1>'+
    '<div class="big-list">'+
      '<div class="item"><span class="n">01</span><div><div class="t">Form groups of 3–4</div></div></div>'+
      '<div class="item"><span class="n">02</span><div><div class="t">15 minutes to read</div><div class="s">One article each, on a current DNA/RNA development</div></div></div>'+
      '<div class="item"><span class="n">03</span><div><div class="t">Every member speaks — 1 to 2 minutes</div><div class="s">What you found. What intrigued you. Why.</div></div></div>'+
    '</div></div>'
},
{
  note: "Say explicitly: I'm not grading you on reading the abstract back to me. I'm grading you on whether you understood it enough to have an opinion about it.",
  html: '<div class="frame"><span class="eyebrow">Graded on</span>'+
    '<h1 class="slide-title" style="font-size:clamp(2rem,4vw,3rem)">What I’m listening for</h1>'+
    '<div class="rubric">'+
      '<div class="row"><span class="k">Understanding</span><span class="v">Did you get the core idea right?<small>Not every detail — the actual point of the piece.</small></span></div>'+
      '<div class="row"><span class="k">Clarity</span><span class="v">Can we follow it in under 2 minutes?<small>Explain it like you would to a friend outside this course.</small></span></div>'+
      '<div class="row"><span class="k">Insight</span><span class="v">What actually caught your attention — and why?<small>Not a summary. A reaction.</small></span></div>'+
    '</div></div>'
},
{
  note: "Start the timer once groups have their article and are seated. This slide's clock is real — tap Start.",
  html: '<div class="frame"><span class="eyebrow">Reading time</span>'+
    '<div class="timer-wrap">'+
      '<div class="timer-digits" id="timerDigits">15:00</div>'+
      '<div class="timer-btns">'+
        '<button class="tbtn primary" id="timerStart" type="button">Start</button>'+
        '<button class="tbtn" id="timerReset" type="button">Reset</button>'+
      '</div>'+
    '</div></div>'
}
];

/* ------------------------------------------------------------ diagrams */
function diagramBigPicture(){
  return '<div class="svgwrap"><svg viewBox="0 0 900 220" role="img" aria-label="DNA to RNA to Protein pipeline">'+
    box(20,60,220,100,'var(--accent)') + label(130,100,'DNA','lbl') + labeldim(130,124,'archive / ROM') +
    arrow(240,110,340,110) +
    box(340,60,220,100,'var(--copper)') + label(450,100,'RNA','lbl') + labeldim(450,124,'working copy / RAM') +
    arrow(560,110,660,110) +
    box(660,60,220,100,'var(--accent)') + label(770,100,'PROTEIN','lbl') + labeldim(770,124,'output / actuator') +
    '</svg></div>';
}
function diagramTwistedPair(){
  return '<div class="svgwrap"><svg viewBox="0 0 900 260" role="img" aria-label="Twisted pair cable compared to DNA double helix">'+
    '<text class="lbl-accent" x="220" y="30" text-anchor="middle">TWISTED PAIR CABLE</text>'+
    '<path d="M120 50 C170 80,170 110,120 140 C70 170,70 200,120 230" fill="none" stroke="var(--accent)" stroke-width="5"/>'+
    '<path d="M320 50 C270 80,270 110,320 140 C370 170,370 200,320 230" fill="none" stroke="var(--ink-dim)" stroke-width="5"/>'+
    '<text class="lbl-accent" x="670" y="30" text-anchor="middle">DNA DOUBLE HELIX</text>'+
    '<path d="M580 50 C630 80,630 110,580 140 C530 170,530 200,580 230" fill="none" stroke="var(--copper)" stroke-width="5"/>'+
    '<path d="M780 50 C730 80,730 110,780 140 C830 170,830 200,780 230" fill="none" stroke="var(--ink-dim)" stroke-width="5"/>'+
    [70,100,130,160,190].map(function(y){ return '<line x1="'+(120-((y-70)%40<20?18:-18))+'" y1="'+y+'" x2="'+(320+((y-70)%40<20?18:-18))+'" y2="'+y+'" stroke="var(--line)" stroke-width="2" opacity=".5"/>'; }).join('')+
    [70,100,130,160,190].map(function(y){ return '<line x1="'+(580-((y-70)%40<20?18:-18))+'" y1="'+y+'" x2="'+(780+((y-70)%40<20?18:-18))+'" y2="'+y+'" stroke="var(--line)" stroke-width="2" opacity=".5"/>'; }).join('')+
    '</svg></div>';
}
function diagramAlphabet(){
  var letters = [['A','var(--accent)'],['T','var(--copper)'],['G','var(--copper)'],['C','var(--accent)']];
  var cells = letters.map(function(L,i){
    var x = 60 + i*160;
    return '<rect x="'+x+'" y="30" width="120" height="90" rx="10" fill="none" stroke="'+L[1]+'" stroke-width="3"/>'+
           '<text x="'+(x+60)+'" y="88" text-anchor="middle" font-family="var(--mono)" font-weight="800" font-size="42" fill="'+L[1]+'">'+L[0]+'</text>';
  }).join('');
  return '<div class="svgwrap"><svg viewBox="0 0 700 220" role="img" aria-label="Four base letters, A pairs with T, G pairs with C">'+
    cells +
    '<path d="M120 120 L120 150 L300 150 L300 120" fill="none" stroke="var(--ink-lo)" stroke-width="2" stroke-dasharray="4 4"/>'+
    '<text x="210" y="175" text-anchor="middle" class="lbl-accent">KEYED PAIR</text>'+
    '<path d="M440 120 L440 150 L620 150 L620 120" fill="none" stroke="var(--ink-lo)" stroke-width="2" stroke-dasharray="4 4"/>'+
    '<text x="530" y="175" text-anchor="middle" class="lbl-copper">KEYED PAIR</text>'+
    '</svg></div>';
}
function diagramZipper(){
  function tooth(x,y){ return '<rect x="'+(x-5)+'" y="'+y+'" width="10" height="16" rx="2" fill="var(--ink-dim)"/>'; }
  var teeth1='', teeth2='';
  for(var i=0;i<6;i++){ teeth1 += tooth(150,40+i*26) + tooth(170,53+i*26); }
  for(var i=0;i<6;i++){ teeth2 += tooth(560,40+i*26) + tooth(600,40+i*26); }
  return '<div class="svgwrap"><svg viewBox="0 0 760 250" role="img" aria-label="A zipper unzipping into two zippers">'+
    '<text class="lbl-accent" x="160" y="20" text-anchor="middle">ONE, ZIPPED</text>'+
    '<line x1="160" y1="35" x2="160" y2="205" stroke="var(--accent)" stroke-width="4"/>'+
    teeth1+
    '<text class="lbl-dim" x="160" y="228" text-anchor="middle">closed</text>'+
    '<path d="M280 120 L340 120" stroke="var(--ink-lo)" stroke-width="3" marker-end="url(#zarrow)"/>'+
    '<defs><marker id="zarrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink-lo)"/></marker></defs>'+
    '<text class="lbl-copper" x="600" y="20" text-anchor="middle">TWO, UNZIPPED + REBUILT</text>'+
    '<line x1="545" y1="35" x2="545" y2="205" stroke="var(--copper)" stroke-width="4"/>'+
    '<line x1="615" y1="35" x2="615" y2="205" stroke="var(--accent)" stroke-width="4"/>'+
    teeth2+
    '<text class="lbl-dim" x="580" y="228" text-anchor="middle">old side + new side, twice</text>'+
    '</svg></div>';
}

  return '<div class="svgwrap"><svg viewBox="0 0 900 200" role="img" aria-label="Blueprint to work order to CNC machine to finished part">'+
    box(10,55,190,90,'var(--accent)') + label(105,92,'BLUEPRINT','lbl-accent',13) + labeldim(105,116,'DNA, stays put') +

    box(270,55,190,90,'var(--copper)') + label(365,92,'WORK ORDER','lbl-copper',13) + labeldim(365,116,'mRNA, sent out') +
    arrow(470,100,530,100) +
    box(530,55,190,90,'var(--accent)') + label(625,86,'CNC MACHINE','lbl-accent',12) + labeldim(625,106,'ribosome') + labeldim(625,122,'reads, doesn’t improvise') +
    arrow(730,100,790,100) +
    box(790,55,100,90,'var(--copper)') + label(840,86,'PART','lbl-copper',13) + labeldim(840,108,'protein') +

function diagramLookup(){
  return '<div class="svgwrap"><svg viewBox="0 0 700 190" role="img" aria-label="Three letter codon read as a fixed width instruction word">'+
    [0,1,2].map(function(i){ var x=60+i*90; return '<rect x="'+x+'" y="40" width="70" height="70" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/>'+
      '<text x="'+(x+35)+'" y="86" text-anchor="middle" font-family="var(--mono)" font-weight="800" font-size="26" fill="var(--accent)">'+['A','U','G'][i]+'</text>'; }).join('')+
    '<text x="195" y="132" text-anchor="middle" class="lbl-dim">one codon — 3 letters</text>'+
    arrow(340,75,420,75) +
    '<rect x="440" y="40" width="220" height="70" rx="8" fill="none" stroke="var(--copper)" stroke-width="3"/>'+
    '<text x="550" y="82" text-anchor="middle" font-family="var(--mono)" font-weight="700" font-size="20" fill="var(--copper)">Methionine</text>'+

function box(x,y,w,h,stroke){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="none" stroke="'+stroke+'" stroke-width="3"/>'; }
function label(cx,cy,text,cls,size){ return '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" class="'+cls+'"'+(size?' font-size="'+size+'"':'')+' font-weight="800">'+text+'</text>'; }
function labeldim(cx,cy,text){ return '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" class="lbl-dim">'+text+'</text>'; }
function arrow(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--ink-lo)" stroke-width="3" marker-end="url(#arrowhead)"/>'+
  '<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-lo)"/></marker></defs>'; }

/* --------------------------------------------------------------- render */
var deck = document.getElementById("deck");
SLIDES.forEach(function(s, i){
  var el = document.createElement("section");
  el.className = "slide"; el.dataset.i = i;
  el.innerHTML = s.html;
  deck.appendChild(el);
});
var dotsEl = document.getElementById("dots");
SLIDES.forEach(function(_, i){
  var d = document.createElement("span");
  dotsEl.appendChild(d);
});

var cur = 0;
var slideEls = Array.prototype.slice.call(deck.children);
var notesOn = false;

function render(){
  slideEls.forEach(function(el, i){
    el.classList.toggle("active", i === cur);
    el.classList.toggle("prevleft", i < cur);
  });
  document.getElementById("progress").style.width = (((cur+1)/SLIDES.length)*100) + "%";
  document.getElementById("counter").innerHTML = "<b>"+(cur+1)+"</b> / "+SLIDES.length;
  Array.prototype.forEach.call(dotsEl.children, function(d,i){ d.classList.toggle("on", i===cur); });
  document.getElementById("prevBtn").disabled = cur===0;
  document.getElementById("nextBtn").disabled = cur===SLIDES.length-1;
  document.getElementById("hint").style.display = (cur===0 && !notesOn) ? "flex" : "none";
  if(notesOn){
    document.getElementById("noteText").textContent = SLIDES[cur].note;
    document.getElementById("notebar").classList.add("show");
  }
  wireTimer();
}
function go(delta){
  var n = cur + delta;
  if(n < 0 || n >= SLIDES.length) return;
  cur = n; render();
}
document.getElementById("prevBtn").addEventListener("click", function(){ go(-1); });
document.getElementById("nextBtn").addEventListener("click", function(){ go(1); });
document.getElementById("tapLeft").addEventListener("click", function(){ go(-1); });
document.getElementById("tapRight").addEventListener("click", function(){ go(1); });
document.addEventListener("keydown", function(e){
  if(e.key === "ArrowRight" || e.key === " ") { go(1); }
  else if(e.key === "ArrowLeft") { go(-1); }
});

document.getElementById("notesBtn").addEventListener("click", function(){
  notesOn = !notesOn;
  this.textContent = "Notes: " + (notesOn ? "on" : "off");
  this.classList.toggle("on", notesOn);
  document.getElementById("noteText").textContent = notesOn ? SLIDES[cur].note : "";
  document.getElementById("notebar").classList.toggle("show", notesOn);
  document.getElementById("hint").style.display = (cur===0 && !notesOn) ? "flex" : "none";
});

/* ----------------------------------------------------------------- timer */
var timerSeconds = 15*60;
var timerRunning = false;
var timerHandle = null;
var timerWired = false;

function fmt(s){
  var m = Math.floor(s/60), r = s%60;
  return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;
}
function tickTimer(){
  timerSeconds--;
  var digitsEl = document.getElementById("timerDigits");
  if(digitsEl) digitsEl.textContent = fmt(Math.max(0,timerSeconds));
  if(timerSeconds <= 60 && digitsEl) digitsEl.classList.add("warn");
  if(timerSeconds <= 0){
    clearInterval(timerHandle); timerRunning = false;
    var btn = document.getElementById("timerStart");
    if(btn) btn.textContent = "Start";
  }
}
function wireTimer(){
  var startBtn = document.getElementById("timerStart");
  var resetBtn = document.getElementById("timerReset");
  if(!startBtn || timerWired) return;
  timerWired = true;
  startBtn.addEventListener("click", function(){
    if(timerRunning){
      clearInterval(timerHandle); timerRunning = false; startBtn.textContent = "Start";
    } else {
      timerRunning = true; startBtn.textContent = "Pause";
      timerHandle = setInterval(tickTimer, 1000);
    }
  });
  resetBtn.addEventListener("click", function(){
    clearInterval(timerHandle); timerRunning = false;
    timerSeconds = 15*60;
    startBtn.textContent = "Start";
    var d = document.getElementById("timerDigits");
    d.textContent = fmt(timerSeconds); d.classList.remove("warn");
  });
}

render();
})();
</script>
